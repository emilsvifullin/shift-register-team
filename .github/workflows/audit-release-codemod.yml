name: Audit Release Codemod

on:
  push:
    branches:
      - audit/full-visual-mobile-v1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: audit/full-visual-mobile-v1

      - name: Apply release updates
        shell: python
        run: |
          from pathlib import Path
          import json, re

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f"missing token in {path}: {old!r}")
              p.write_text(s.replace(old,new))

          for path in ["index.html","login.html","tests/fixtures/platform-shell.html"]:
              p=Path(path)
              s=p.read_text()
              if "styles/interaction.css" not in s:
                  pattern=r'(<link[^>]+href="(?:\.\./\.\./|\./)?styles/refinement\.css"[^>]*>)'
                  s,n=re.subn(pattern,r'\1\n  <link rel="stylesheet" href="' + ("../../styles/interaction.css" if "fixtures" in path else "./styles/interaction.css") + '">',s,count=1)
                  if n!=1:
                      raise SystemExit(f"could not insert interaction.css in {path}")
                  p.write_text(s)

          sw=Path("sw.js")
          s=sw.read_text().replace("sr-team-runtime-v4","sr-team-runtime-v5")
          if '"./styles/interaction.css"' not in s:
              s=s.replace('  "./styles/refinement.css",','  "./styles/refinement.css",\n  "./styles/interaction.css",')
          sw.write_text(s)

          for path in ["src/config.js","package.json","package-lock.json"]:
              p=Path(path)
              p.write_text(p.read_text().replace("6.19.0","6.20.0"))

          p=Path("tests/production-shell.test.js")
          s=p.read_text().replace("sr-team-runtime-v4","sr-team-runtime-v5")
          p.write_text(s)

          p=Path(".github/workflows/quality.yml")
          s=p.read_text().replace(
              "npx playwright test e2e/platform-shell.spec.mjs --browser=${{ matrix.browser }} --reporter=line",
              "npx playwright test e2e/platform-shell.spec.mjs e2e/interaction.spec.mjs --browser=${{ matrix.browser }} --reporter=line"
          )
          p.write_text(s)

          Path(".github/workflows/audit-release-codemod.yml").unlink()

      - name: Commit release updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: prepare 6.20.0 visual audit release"
          git push origin HEAD:audit/full-visual-mobile-v1
