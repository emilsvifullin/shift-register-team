name: Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Remove merged audit branch and cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete audit/full-visual-mobile-v1 || true
          rm -f .github/workflows/branch-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: clean merged UI audit branch"
          git push origin HEAD:main
