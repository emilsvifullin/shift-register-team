name: Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged branch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete refactor/ux-geometry-v2
          rm .github/workflows/branch-cleanup.yml
          git add .github/workflows/branch-cleanup.yml
          git commit -m "chore: clean merged UX branch"
          git push origin HEAD:main
