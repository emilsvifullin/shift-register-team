name: Cleanup merged branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove merged audit branch
        run: git push origin --delete refactor/fluid-mobile-v2 || true
      - name: Remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-cleanup.yml
          git commit -m "chore: clean merged mobile audit branch"
          git push origin HEAD:main
