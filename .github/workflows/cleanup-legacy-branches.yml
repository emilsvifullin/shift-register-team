name: Cleanup merged legacy branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-legacy-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged legacy branches and self-clean
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            codex/alphabetic-point-sorting \
            codex/optional-substitute-accounts
          do
            git push origin --delete "$branch" || true
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-legacy-branches.yml
          git commit -m "chore: finish legacy branch cleanup"
          git push origin HEAD:main
