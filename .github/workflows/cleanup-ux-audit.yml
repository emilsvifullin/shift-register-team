name: Cleanup merged UX audit branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: clean merged UX audit branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete merged audit branch
        run: git push origin --delete audit/e2e-ux-state-v1 || true

      - name: Remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-ux-audit.yml
          git commit -m "chore: remove UX audit cleanup workflow"
          git push origin HEAD:main
