name: Quality

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Run quality checks
        run: npm run check

  browser:
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shift-register-http.log 2>&1 &
          echo $! > /tmp/shift-register-http.pid

      - name: Wait for server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tests/fixtures/platform-shell.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shift-register-http.log
          exit 1

      - name: Run browser smoke
        run: npx playwright test e2e/platform-shell.spec.mjs e2e/interaction.spec.mjs e2e/state-transitions.spec.mjs e2e/bottom-dock.spec.mjs e2e/management-layout.spec.mjs e2e/management-navigation.spec.mjs e2e/management-tap-intent.spec.mjs --browser=${{ matrix.browser }} --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
