name: Quality

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Node checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run quality checks
        run: npm run check

  browser:
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: checks

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shift-register-http.log 2>&1 &
          echo $! > /tmp/shift-register-http.pid

      - name: Wait for server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tests/fixtures/platform-shell.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shift-register-http.log
          exit 1

      - name: Run browser smoke
        run: npx playwright test e2e/platform-shell.spec.mjs --browser=${{ matrix.browser }} --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
