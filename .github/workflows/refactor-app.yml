name: Refactor app shell

on:
  push:
    branches:
      - refactor/production-quality-baseline
    paths:
      - ".github/workflows/refactor-app.yml"
      - "scripts/refactor-app.mjs"
      - "scripts/refactor-styles.mjs"
      - "scripts/refactor-static-tests.mjs"
      - "src/ui/**"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/production-quality-baseline
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded codemods
        run: |
          node ./scripts/refactor-app.mjs
          node ./scripts/refactor-styles.mjs
          node ./scripts/refactor-static-tests.mjs

      - name: Install
        run: npm ci

      - name: Validate refactored tree
        id: validate
        shell: bash
        run: |
          set +e
          npm run check > /tmp/refactor-check.log 2>&1
          check_status=$?
          git diff --check >> /tmp/refactor-check.log 2>&1
          diff_status=$?
          cat /tmp/refactor-check.log
          if [ "$check_status" -ne 0 ] || [ "$diff_status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Persist validation diagnostic
        if: failure() && steps.validate.outputs.failed == 'true'
        shell: bash
        run: |
          cp /tmp/refactor-check.log /tmp/refactor-validation.log
          git reset --hard HEAD
          git clean -fd
          cp /tmp/refactor-validation.log refactor-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refactor-validation.log
          git commit -m "ci: capture refactor validation failure" || exit 0
          git push origin HEAD:refactor/production-quality-baseline

      - name: Commit refactor
        if: success()
        run: |
          if git diff --quiet; then
            echo "No refactor changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f refactor-validation.log 2>/dev/null || true
          git add \
            src/app.js \
            styles.css \
            styles/accessibility.css \
            styles/motion.css \
            styles/workflow.css \
            styles/auth.css \
            index.html \
            login.html \
            sw.js \
            tests/static.test.js
          git commit -m "refactor: modularize app styles and input behavior"
          git push origin HEAD:refactor/production-quality-baseline
