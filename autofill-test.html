<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0B0C0E"
    media="(prefers-color-scheme: dark)"
  >

  <meta
    name="theme-color"
    content="#F2F1EE"
    media="(prefers-color-scheme: light)"
  >

  <title>AutoFill Test</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body class="app-booting">

<div
  class="auth-gate"
  id="authGate"
  aria-hidden="false"
>
  <div class="auth-card">

    <div class="auth-brand">
      Shift Register
    </div>

    <h1 class="auth-title">
      Вход
    </h1>

    <div class="auth-subtitle">
      Войдите в рабочий аккаунт
    </div>

    <form
      class="auth-form"
      id="authForm"
      method="post"
      autocomplete="on"
    >

      <label
        class="auth-field"
        for="email"
      >
        <span>Email</span>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          dir="ltr"
          enterkeyhint="next"
          required
        >
      </label>

      <label
        class="auth-field"
        for="current-password"
      >
        <span>Пароль</span>

        <input
          type="password"
          id="current-password"
          name="password"
          autocomplete="current-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          dir="ltr"
          enterkeyhint="go"
          required
        >
      </label>

      <div
        class="auth-error"
        id="authError"
        role="alert"
        hidden
      ></div>

      <button
        type="submit"
        class="auth-submit"
        id="authSubmit"
      >
        Войти
      </button>

    </form>

  </div>
</div>

<script>
  window.setTimeout(
    ()=>{
      document.body.classList.remove(
        "app-booting"
      );
    },
    1500
  );
</script>

</body>
</html>
