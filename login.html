<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="theme-color"
    content="#0B0C0E"
    media="(prefers-color-scheme: dark)"
  >

  <meta
    name="theme-color"
    content="#F2F1EE"
    media="(prefers-color-scheme: light)"
  >

  <title>Shift Register</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body class="login-page">

<div
  class="auth-gate"
  id="authGate"
>
  <div class="auth-card">

    <div class="auth-brand">
      Shift Register
    </div>

    <h1 class="auth-title">
      Вход
    </h1>

    <div class="auth-subtitle">
      Войдите в рабочий аккаунт
    </div>

    <form
      class="auth-form"
      id="authForm"
      method="post"
      autocomplete="on"
    >

      <label
        class="auth-field"
        for="email"
      >
        <span>Email</span>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="next"
          dir="ltr"
          readonly
          required
        >
      </label>

      <label
        class="auth-field"
        for="current-password"
      >
        <span>Пароль</span>

        <input
          type="password"
          id="current-password"
          name="password"
          autocomplete="current-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          dir="ltr"
          readonly
          required
        >
      </label>

      <div
        class="auth-error"
        id="authError"
        role="alert"
        hidden
      ></div>

      <button
        type="submit"
        class="auth-submit"
        id="authSubmit"
      >
        Войти
      </button>

    </form>

  </div>
</div>

<script
  type="module"
  src="./src/login.js"
></script>

</body>
</html>
