<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <style>
    html{
      color-scheme:dark;
      background:#0B0C0E;
    }

    @media (prefers-color-scheme: light){
      html{
        color-scheme:light;
        background:#F2F1EE;
      }
    }
  </style>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="referrer"
    content="no-referrer"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://shift-register-supabase-proxy.vercel.app; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Shift Register"
  >

  <meta
    name="theme-color"
    content="#0B0C0E"
    media="(prefers-color-scheme: dark)"
  >

  <meta
    name="theme-color"
    content="#F2F1EE"
    media="(prefers-color-scheme: light)"
  >

  <style>
    html,
    body{
      width:100%;
      height:100%;
      margin:0;

      background:#0B0C0E;
    }

    @media (prefers-color-scheme: light){
      html,
      body{
        background:#F2F1EE;
      }
    }
  </style>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >

  <link
    rel="icon"
    href="./icon-192.png"
  >

  <title>Shift Register</title>

  <script src="./src/frame-guard.js"></script>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body class="login-page">

<div
  class="auth-gate"
  id="authGate"
>
  <div class="auth-card">

    <div class="auth-brand">
      Shift Register
    </div>

    <h1 class="auth-title">
      Вход
    </h1>

    <div class="auth-subtitle">
      Войдите в рабочий аккаунт
    </div>

    <form
      class="auth-form"
      id="authForm"
      method="post"
      autocomplete="on"
      novalidate
    >

      <label
        class="auth-field"
        for="email"
      >
        <span>Почта</span>

        <input
          type="email"
          id="email"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="next"
          dir="ltr"
          readonly
          required
        >
      </label>

      <label
        class="auth-field"
        for="current-password"
      >
        <span>Пароль</span>

        <input
          type="password"
          id="current-password"
          name="password"
          autocomplete="current-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          dir="ltr"
          readonly
          required
        >
      </label>

      <div
        class="auth-error"
        id="authError"
        role="alert"
        hidden
      ></div>

      <button
        type="button"
        class="auth-submit"
        id="authSubmit"
      >
        Войти
      </button>

    </form>

  </div>
</div>

<script
  type="module"
  src="./src/login.js"
></script>

</body>
</html>
