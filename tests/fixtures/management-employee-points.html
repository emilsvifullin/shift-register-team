<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Management employee points fixture</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../styles/management.css">
</head>
<body data-active-tab="manage">
<div id="employeeSheetBody">
  <input id="employeeName" value="Тестовый сотрудник">
  <div class="card employee-points">
    <button type="button" class="employee-point" data-employee-point="active-a">
      <span class="employee-point-check" aria-hidden="true"></span>
      <span class="employee-point-name">Активный А</span>
    </button>
    <button type="button" class="employee-point on" data-employee-point="archived-selected">
      <span class="employee-point-check" aria-hidden="true">✓</span>
      <span class="employee-point-name">Архивный назначенный</span>
    </button>
    <button type="button" class="employee-point" data-employee-point="active-b">
      <span class="employee-point-check" aria-hidden="true"></span>
      <span class="employee-point-name">Активный Б</span>
    </button>
  </div>
</div>

<script>
  const emptyCatalog=
    new URLSearchParams(
      window.location.search
    ).has("empty");

  const catalog=emptyCatalog
    ? []
    : [
        {id:"active-a",name:"Активный А",active:true},
        {id:"active-b",name:"Активный Б",active:true},
        {id:"archived-free",name:"Архивный свободный",active:false},
        {id:"archived-selected",name:"Архивный назначенный",active:false}
      ];

  window.supabase={
    createClient(){
      return {
        auth:{
          onAuthStateChange(){
            return {
              data:{
                subscription:{
                  unsubscribe(){}
                }
              }
            };
          }
        },
        realtime:{
          setAuth(){
            return Promise.resolve();
          }
        },
        from(table){
          if(table!=="points"){
            throw new Error("unexpected table");
          }

          return {
            select(){
              return {
                order(){
                  return Promise.resolve({
                    data:catalog,
                    error:null
                  });
                }
              };
            }
          };
        }
      };
    }
  };
</script>
<script type="module" src="../../src/management-employee-points.js"></script>
</body>
</html>
