<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Management navigation fixture</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../styles/accessibility.css">
<link rel="stylesheet" href="../../styles/motion.css">
<link rel="stylesheet" href="../../styles/workflow.css">
<link rel="stylesheet" href="../../styles/auth.css">
<link rel="stylesheet" href="../../styles/platform.css">
<link rel="stylesheet" href="../../styles/refinement.css">
<link rel="stylesheet" href="../../styles/interaction.css">
</head>
<body data-active-tab="manage" data-input-modality="pointer">
<header>
  <div class="nav">
    <button id="prevM" class="is-hidden" disabled aria-label="Назад">
      <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M9 3L3 8L9 13"></path></svg>
    </button>
    <button type="button" class="period" id="period">УПРАВЛЕНИЕ</button>
    <button id="nextM" class="is-hidden" disabled aria-label="Вперёд">
      <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M3 3L9 8L3 13"></path></svg>
    </button>
  </div>
</header>

<main id="app" role="tabpanel"></main>

<div class="veil" id="manageEditorVeil" aria-hidden="true"></div>
<div class="sheet" id="manageEditorSheet" aria-hidden="true" tabindex="-1">
  <div class="grab"></div>
  <div class="shead">
    <button type="button" class="lnk" id="manageEditorCancel">Закрыть</button>
    <div class="ttl" id="manageEditorTitle">Пункт выдачи</div>
    <button type="button" class="lnk b" id="manageEditorSave">Изменить</button>
  </div>
  <div class="sbody" id="manageEditorBody"></div>
</div>

<div class="veil" id="employeeVeil" aria-hidden="true"></div>
<div class="sheet" id="employeeSheet" aria-hidden="true" tabindex="-1">
  <div class="grab"></div>
  <div class="shead">
    <button type="button" class="lnk" id="employeeSheetCancel">Закрыть</button>
    <div class="ttl" id="employeeSheetTitle">Сотрудник</div>
    <button type="button" class="lnk b" id="employeeSheetSave">Изменить</button>
  </div>
  <div class="sbody" id="employeeSheetBody"></div>
</div>

<div class="app-confirm" id="appConfirm" aria-hidden="true">
  <div class="app-confirm-box">
    <div class="app-confirm-text">
      <div class="app-confirm-title" id="appConfirmTitle"></div>
      <div class="app-confirm-detail" id="appConfirmDetail" hidden></div>
    </div>
    <div class="app-confirm-actions">
      <button type="button" class="app-confirm-btn" id="appConfirmCancel">Отмена</button>
      <button type="button" class="app-confirm-btn ok" id="appConfirmOk">Подтвердить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const app=document.getElementById("app");
  const editor=document.getElementById("manageEditorSheet");
  const editorBody=document.getElementById("manageEditorBody");
  const editorSave=document.getElementById("manageEditorSave");
  const editorCancel=document.getElementById("manageEditorCancel");

  const employeeSheet=document.getElementById("employeeSheet");
  const employeeBody=document.getElementById("employeeSheetBody");
  const employeeSave=document.getElementById("employeeSheetSave");
  const employeeCancel=document.getElementById("employeeSheetCancel");

  window.manageForwardAttempts=0;
  window.manageBackAttempts=0;
  window.manageForwardBlockedUntil=0;
  window.employeeDeleteCalls=0;
  window.employeeMode="closed";

  function renderHome(){
    app.innerHTML=`
      <div class="ml">Пункты и расчёт</div>
      <div class="card manage-menu">
        <button type="button" class="manage-row" data-manage-section="points">
          <span class="manage-row-copy">
            <span class="manage-row-title">Пункты выдачи и тарифы</span>
            <span class="manage-row-detail">Пункты, активность, ставки и история изменений</span>
          </span>
          <span class="manage-chevron" aria-hidden="true">›</span>
        </button>
      </div>
    `;
  }

  function renderPoints(){
    app.innerHTML=`
      <button type="button" class="manage-back" id="manageBack">
        <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M9 3L3 8L9 13"></path></svg>
        <span>Управление</span>
      </button>
      <div class="ml">Пункты выдачи и тарифы</div>
      <button type="button" class="manage-add" id="pointAdd">＋ Добавить ПВЗ</button>
      <div class="ml">Список</div>
      <div id="pointManageList">
        <div class="card manage-menu point-manage-menu">
          <button type="button" class="manage-row point-manage-row" data-point-id="point-demo">
            <span class="manage-row-copy"><span class="manage-row-title">Тестовый ПВЗ</span></span>
            <span class="manage-chevron" aria-hidden="true">›</span>
          </button>
        </div>
      </div>
    `;
  }

  function openPointView(){
    editor.style.display="block";
    editor.classList.add("on");
    editor.setAttribute("aria-hidden","false");
    document.body.classList.add("sheet-open");
    editorSave.textContent="Изменить";
    editorCancel.textContent="Закрыть";
    editorBody.innerHTML=`
      <div class="ml">Пункт выдачи</div>
      <div class="card employee-detail point-info-card">
        <div class="row"><div class="l"><div class="s">Название</div><div class="t">Тестовый ПВЗ</div></div></div>
      </div>
      <div class="sheet-spacer" aria-hidden="true"></div>
    `;
  }

  function openPointEdit(){
    editorSave.textContent="Готово";
    editorCancel.textContent="Отмена";
    editorBody.innerHTML=`
      <div class="ml">Пункт выдачи</div>
      <div class="card employee-editor">
        <label class="row"><div class="t">Название</div><input id="managePointName" value="Тестовый ПВЗ"></label>
      </div>
      <div class="ml">Статус</div>
      <div class="card segbox"><div class="seg"><button type="button" class="on">Активен</button><button type="button">В архиве</button></div></div>
      <div class="sheet-spacer" aria-hidden="true"></div>
    `;
  }

  function closePointEditor(){
    editor.classList.remove("on");
    editor.setAttribute("aria-hidden","true");
    document.body.classList.remove("sheet-open");
    editorBody.innerHTML="";
    editor.style.display="none";
  }

  function openEmployeeView(){
    window.employeeMode="view";
    employeeSheet.style.display="block";
    employeeSheet.classList.add("on");
    employeeSheet.setAttribute("aria-hidden","false");
    document.body.classList.add("sheet-open");
    employeeSave.textContent="Изменить";
    employeeCancel.textContent="Закрыть";
    employeeBody.innerHTML=`
      <div class="ml">Сотрудник</div>
      <div class="card employee-detail">
        <div class="row"><div class="l"><div class="s">ФИО</div><div class="t">Тестовый сотрудник</div></div></div>
      </div>
      <button type="button" class="btn warn" id="employeeDelete">Удалить сотрудника</button>
      <div class="sheet-spacer" aria-hidden="true"></div>
    `;
  }

  function openEmployeeEdit(){
    window.employeeMode="edit";
    employeeSave.textContent="Готово";
    employeeCancel.textContent="Назад";
    employeeBody.innerHTML=`
      <div class="ml">Сотрудник</div>
      <div class="card employee-editor">
        <label class="row"><div class="t">ФИО</div><input id="employeeName" value="Тестовый сотрудник"></label>
      </div>
      <div class="ml">Пункты выдачи</div>
      <div class="card employee-points"><button type="button" class="employee-point on">Тестовый ПВЗ</button></div>
    `;
  }

  function closeEmployee(){
    window.employeeMode="closed";
    employeeSheet.classList.remove("on");
    employeeSheet.setAttribute("aria-hidden","true");
    employeeBody.innerHTML="";
    employeeSheet.style.display="none";
    document.body.classList.remove("sheet-open");
  }

  window.openEmployeeView=openEmployeeView;

  app.addEventListener("click",event=>{
    const section=event.target.closest?.("[data-manage-section]");

    if(section){
      window.manageForwardAttempts++;

      if(window.manageForwardAttempts===1){
        window.manageForwardBlockedUntil=performance.now()+900;
      }

      if(performance.now()<window.manageForwardBlockedUntil){
        return;
      }

      renderPoints();
      return;
    }

    const back=event.target.closest?.("#manageBack");

    if(back){
      window.manageBackAttempts++;

      if(window.manageBackAttempts===1){
        return;
      }

      renderHome();
      return;
    }

    const point=event.target.closest?.("[data-point-id]");
    if(point){
      openPointView();
    }
  });

  editorSave.addEventListener("click",()=>{
    if(editorSave.textContent==="Изменить"){
      openPointEdit();
    }
  });

  editorCancel.addEventListener("click",closePointEditor);

  employeeSave.addEventListener("click",()=>{
    if(employeeSave.textContent==="Изменить"){
      openEmployeeEdit();
    }
  });

  employeeCancel.addEventListener("click",()=>{
    if(window.employeeMode==="edit"){
      openEmployeeView();
      return;
    }

    closeEmployee();
  });

  employeeBody.addEventListener("click",event=>{
    const button=event.target.closest?.("#employeeDelete");

    if(!button || window.employeeMode!=="view"){
      return;
    }

    window.employeeDeleteCalls++;
    const confirm=document.getElementById("appConfirm");
    document.getElementById("appConfirmTitle").textContent="Удалить сотрудника?";
    confirm.classList.add("on");
    confirm.setAttribute("aria-hidden","false");
  });

  document.getElementById("appConfirmCancel").addEventListener("click",()=>{
    document.getElementById("appConfirm").classList.remove("on");
    document.getElementById("appConfirm").setAttribute("aria-hidden","true");
  });

  document.getElementById("appConfirmOk").addEventListener("click",()=>{
    document.getElementById("appConfirm").classList.remove("on");
    document.getElementById("appConfirm").setAttribute("aria-hidden","true");
  });

  renderHome();
</script>
<script type="module" src="../../src/management-navigation.js"></script>
</body>
</html>
