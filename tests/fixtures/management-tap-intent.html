<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Management tap intent fixture</title>
</head>
<body>
<main id="app"></main>
<script>
  const app=document.getElementById("app");
  window.manageTapAttempts=0;
  window.manageTapBlockedUntil=0;

  function renderHome(){
    app.innerHTML=`
      <button type="button" data-manage-section="points">
        Пункты выдачи и тарифы
      </button>
    `;
  }

  function renderPoints(){
    app.innerHTML=`
      <div id="pointManageList">Пункты выдачи и тарифы</div>
    `;
  }

  app.addEventListener("click",event=>{
    const button=event.target.closest?.("[data-manage-section]");
    if(!button) return;

    window.manageTapAttempts++;

    if(window.manageTapAttempts===1){
      window.manageTapBlockedUntil=performance.now()+650;
    }

    if(performance.now()<window.manageTapBlockedUntil){
      return;
    }

    renderPoints();
  });

  renderHome();
</script>
<script type="module" src="../../src/management-tap-intent.js"></script>
</body>
</html>
