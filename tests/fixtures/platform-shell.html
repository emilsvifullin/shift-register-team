<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <link
    rel="stylesheet"
    href="../../styles.css"
  >
  <link
    rel="stylesheet"
    href="../../styles/accessibility.css"
  >
  <script src="../../src/frame-guard.js"></script>
</head>
<body class="app-booting">
  <main
    id="app"
    role="tabpanel"
  >
    Test panel
  </main>

  <div class="bottom-controls">
    <nav
      class="tabs"
      role="tablist"
      aria-label="Разделы"
    >
      <button
        type="button"
        role="tab"
        id="tab-shifts"
        aria-controls="app"
        aria-selected="true"
        tabindex="0"
      >Смены</button>

      <button
        type="button"
        role="tab"
        id="tab-stats"
        aria-controls="app"
        aria-selected="false"
        tabindex="-1"
      >Итоги</button>

      <button
        type="button"
        role="tab"
        id="tab-manage"
        aria-controls="app"
        aria-selected="false"
        tabindex="-1"
      >Управление</button>

      <button
        type="button"
        role="tab"
        id="tab-data"
        aria-controls="app"
        aria-selected="false"
        tabindex="-1"
      >Данные</button>
    </nav>
  </div>

  <script>
    const tabs=Array.from(
      document.querySelectorAll(
        '[role="tab"]'
      )
    );

    for(const tab of tabs){
      tab.addEventListener(
        "click",
        ()=>{
          for(const item of tabs){
            const selected=
              item===tab;

            item.setAttribute(
              "aria-selected",
              String(selected)
            );

            item.tabIndex=
              selected
                ? 0
                : -1;
          }
        }
      );
    }

    document.body.classList.remove(
      "app-booting"
    );
  </script>
</body>
</html>
